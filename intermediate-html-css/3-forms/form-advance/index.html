<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <form action="">
        <fieldset>
            <legend>Paramètres du Tournoi</legend>
            <label for="nom">nom du tournoi</label>
            <input type="text" id="nom" minlength="5" required>

            <label for="player">nombre de joueurs</label>
            <input type="number" id="player" min="4" max="32" required>

            <label for="date">date</label>
            <input type="date" id="date" required>

            <label for="niveau">niveau</label>
            <input type="range" id="niveau" min="1" max="10" required>

            <label for="list">lieu</label>
            <input type="text" list="list" required>
            <datalist id="list">
                <option value="Paris"></option>
                <option value="Lyon"></option>
                <option value="Tokyo"></option>
            </datalist>
        </fieldset>
        <button type="submit">Envoyer</button>
    </form>
</body>

</html>
